name: package:harfbuzz_ffi

on:
  push:
    tags:
      - 'harfbuzz_ffi-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  precompile:
    name: Precompile (${{ matrix.os }} / ${{ matrix.target-os }}-${{ matrix.target-arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target-os: linux
            target-arch: x64
          # - os: ubuntu-22.04-arm
          #   target-os: linux
          #   target-arch: arm64
          - os: ubuntu-22.04
            target-os: android
            target-arch: x64
          - os: ubuntu-22.04
            target-os: android
            target-arch: arm64
          - os: macos-14
            target-os: macos
            target-arch: arm64
          - os: macos-14
            target-os: macos
            target-arch: x64
          - os: windows-latest
            target-os: windows
            target-arch: x64
          # - os: windows-latest
          #   target-os: windows
          #   target-arch: arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run tool/precompile_binaries.dart --target-os=${{ matrix.target-os }} --target-arch=${{ matrix.target-arch }}
        working-directory: packages/harfbuzz/harfbuzz_ffi
      - run: ls -l packages/harfbuzz/harfbuzz_ffi/bin
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.target-os }}-${{ matrix.target-arch }}
          path: packages/harfbuzz/harfbuzz_ffi/bin/*
          if-no-files-found: error

  publish-release:
    name: Attach Binaries to GitHub Release
    needs: precompile
    if: startsWith(github.ref, 'refs/tags/harfbuzz_ffi-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets
          merge-multiple: true

      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
          if [ "$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets | length')" -eq 0 ]; then
            gh release upload "${GITHUB_REF_NAME}" release-assets/*
          else
            echo "Release ${GITHUB_REF_NAME} already has assets; skipping upload to preserve recorded SHA-256 hashes."
          fi
