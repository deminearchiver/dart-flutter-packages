name: material
description: A Flutter library implementing Google's Material 3 Expressive design system.
version: 2.0.0
homepage: https://github.com/deminearchiver/dart-flutter-packages
repository: https://github.com/deminearchiver/dart-flutter-packages/tree/main/packages/material
issue_tracker: https://github.com/deminearchiver/dart-flutter-packages/issues
topics: [ui, widgets, material]
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  # SDK dependencies
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Path dependencies
  animation:
    path: ../animation
  layout:
    path: ../layout

  # Hosted dependencies
  androidx_graphics_shapes: ^1.6.0
  collection: ^1.19.1
  libmonet: 2.0.0-dev.18
  material_symbols_icons: ^4.2951.0
  meta: ^1.18.0
  motor: ^1.1.0
  touch_targets: ^0.5.0
  nested: ^1.0.0
  material_3p: ^0.4.0+1

dev_dependencies:
  # SDK dependencies
  flutter_test:
    sdk: flutter

  # Hosted dependencies
  deminearchiver_lints: ^2.1.2
  build_runner: ^2.15.0
