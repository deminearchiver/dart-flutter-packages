version: 1
transforms:
  - title: "Replace Center with Align.center"
    date: 2025-12-11
    bulkApply: true
    element:
      uris: ["layout.dart", "src/layout/align.dart"]
      constructor: ""
      inClass: "Center"
    changes:
      - kind: replacedBy
        newElement:
          uris: ["layout.dart"]
          constructor: "center"
          inClass: "Align"
