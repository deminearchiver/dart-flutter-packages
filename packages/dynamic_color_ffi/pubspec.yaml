name: dynamic_color_ffi
description: An FFI-based version of the dynamic_color plugin.
version: 1.1.2
homepage: https://github.com/deminearchiver/dart-flutter-packages
repository: https://github.com/deminearchiver/dart-flutter-packages/tree/main/packages/dynamic_color_ffi
issue_tracker: https://github.com/deminearchiver/dart-flutter-packages/issues
resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  jni: ^1.0.0
  jni_flutter: ^1.0.1
  meta: ^1.17.0
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  deminearchiver_lints: ^3.0.1
  jnigen: ^0.16.0

flutter:
  plugin:
    platforms:
      android:
        dartPluginClass: DynamicColorAndroid
        ffiPlugin: true
