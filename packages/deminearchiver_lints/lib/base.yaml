include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  exclude:
    # Files generated by Freezed.
    - "**/*.freezed.dart"

    # Shared parts from the Dart Build System.
    - "**/*.g.dart"

    # Files generated by Flutter Gen.
    - "**/*.gen.dart"

    # Legacy generated plugin registrant path.
    - "lib/generated_plugin_registrant.dart"

    # Test coverage.
    - "test/.test_coverage.dart"

  errors:
    # Disabled because it gets annoying when dealing
    # with private widget constructors, especially
    # the `key` parameter which is never specified usually.
    unused_element_parameter: ignore

formatter:
  # Force the default page width
  page_width: 80

  # Force the default commas style
  trailing_commas: automate

linter:
  rules:
    # Disabled rules without additional comments.
    always_use_package_imports: false
    avoid_catches_without_on_clauses: false
    avoid_positional_boolean_parameters: false
    avoid_returning_this: false
    parameter_assignments: false
    unreachable_from_main: false
    always_put_required_named_parameters_first: false
    avoid_equals_and_hash_code_on_mutable_classes: false
    document_ignores: false
    prefer_asserts_with_message: false
    no_default_cases: false
    one_member_abstracts: false
    avoid_multiple_declarations_per_line: false
    unnecessary_library_directive: false
    unnecessary_raw_strings: false

    # Enabled rules without additional comments.
    prefer_contains: true

    # Disable rules related to ordering to facilitate manual grouping and sorting.
    combinators_ordering: false
    directives_ordering: false
    sort_constructors_first: false
    sort_unnamed_constructors_first: false
    sort_pub_dependencies: false

    # Rules related to errors.
    avoid_catching_errors: false
    only_throw_errors: false

    # This gets annoying as static methods such as lerp should be allowed.
    prefer_constructors_over_static_methods: false

    # Recommended when working with extension types.
    annotate_redeclares: true

    # TODO(deminearchiver): should this be removed?
    #  See material/../corners.dart.
    avoid_redundant_argument_values: false

    # Always prefer using const
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true

    # The desired quotes style cannot be enforced with existing lints,
    # so quotes-related linter rules must be forcefully disabled.
    prefer_double_quotes: false
    prefer_single_quotes: false
    avoid_escaping_inner_quotes: false

    # The new default commas style from the Dart formatter is preferred.
    require_trailing_commas: false

    # Numbers should be made compatible with the web target.
    avoid_double_and_int_checks: true
    avoid_js_rounded_ints: true
    prefer_int_literals: false

    # Obvious types may be omitted, but the linter rule
    # is purposefully disabled for properties.
    omit_obvious_local_variable_types: true
    omit_obvious_property_types: false
    specify_nonobvious_local_variable_types: false
    specify_nonobvious_property_types: false

    # This specific rule sometimes messes with dot shorthands.
    omit_local_variable_types: false

    # Disabled to allow maintaining feature parity between SDK updates,
    # such as when a new field is added to a class from SDK.
    # TODO(deminearchiver): enable and prefer using single-line ignores.
    avoid_dynamic_calls: false
